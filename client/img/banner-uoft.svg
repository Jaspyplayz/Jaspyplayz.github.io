  <text x="50" y="98" text-anchor="middle" font-family="Cinzel, Georgia, serif" font-weight="700" font-size="11" letter-spacing="1.2" fill="#f0e6d2">U of T</text>
  <path d="M38 103h24" stroke="#c89b3c" stroke-width="1"/>
