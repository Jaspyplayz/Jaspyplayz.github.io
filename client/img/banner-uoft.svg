<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 140">
  <defs>
    <linearGradient id="rod" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f6e7c0"/><stop offset=".45" stop-color="#c89b3c"/><stop offset="1" stop-color="#6b4a1c"/></linearGradient>
    <linearGradient id="trim" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#785a28"/><stop offset=".5" stop-color="#e2c27a"/><stop offset="1" stop-color="#785a28"/></linearGradient>
    <linearGradient id="cloth" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#0f2147"/><stop offset=".22" stop-color="#1e3765"/><stop offset=".5" stop-color="#29498a"/><stop offset=".78" stop-color="#1e3765"/><stop offset="1" stop-color="#0f2147"/></linearGradient>
    <linearGradient id="shade" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#000" stop-opacity=".45"/><stop offset=".18" stop-color="#000" stop-opacity="0"/><stop offset=".85" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".35"/></linearGradient>
  </defs>
  <!-- rod with finials -->
