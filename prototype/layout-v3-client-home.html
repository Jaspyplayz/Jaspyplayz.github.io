<title>Portfolio Layout Prototype</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800&family=Mulish:wght@400;600;700;800&display=swap">
<style>
/* PROTOTYPE v3 (throwaway). Question: what does the portfolio look like laid out like the League client home screen?
   Modelled on Jasper's screenshot of his own client: slim top bar (logo, Play, a few tabs, profile), left event list,
   big hero with eyebrow / title / text / Play, social panel on the right. Top bar trimmed per Jasper.
   Backgrounds are Jasper's own: a gold win-chance curve (Turnpoint's signature) and his project screenshots. No Riot art. */
:root {
  --bg: #010a13;
  --frame: #0a0e13;
  --line: #1e2328;
  --line-2: #3c3c41;
  --gold: #c8aa6e;
  --gold-dim: #785a28;
  --gold-hi: #f0e6d2;
  --ink: #cdbe91;
  --text: #a09b8c;
  --teal: #0ac8b9;
  --teal-dim: #005a82;
  --online: #1ec85a;
  --away: #d4a64a;
  --display: "Cinzel", "Beaufort for LOL", Georgia, serif;
  --body: "Mulish", "Spiegel", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: #05070a; color: var(--text); font: 400 14px/1.5 var(--body); }
p { margin: 0; }
h1, h2, h3 { margin: 0; font-family: var(--display); }
a { color: inherit; }
button { font: inherit; color: inherit; }

.wrap { padding: 16px max(16px, env(safe-area-inset-right, 0px)) 16px max(16px, env(safe-area-inset-left, 0px)); }
.client { max-width: 1280px; margin: 0 auto; border: 1px solid #463714; background: var(--bg); display: grid; grid-template-columns: 1fr 230px; grid-template-rows: auto minmax(560px, 1fr); }
.client > * { min-width: 0; }

/* top bar: logo, Play, tabs ... profile */
.top { grid-column: 1; display: flex; align-items: center; gap: 22px; padding: 10px 18px; border-bottom: 1px solid #463714; background: linear-gradient(180deg, #0d141b, var(--bg)); }
.logo { width: 46px; height: 46px; border-radius: 50%; border: 2px solid var(--gold); padding: 2px; flex: none; background: #000; }
.logo svg { width: 100%; height: 100%; display: block; }
.play { display: inline-flex; align-items: center; padding: 10px 40px 10px 34px; margin-left: -30px; font: 800 15px/1 var(--body); letter-spacing: .14em; color: var(--gold-hi); text-decoration: none; background: linear-gradient(180deg, #0b3b4d, #062433); border: 2px solid var(--teal); clip-path: polygon(0 0, calc(100% - 16px) 0, 100% 50%, calc(100% - 16px) 100%, 0 100%); }
.play:hover { background: linear-gradient(180deg, #0f5168, #083045); }
.tabs { display: flex; gap: 4px; overflow-x: auto; }
.tabs button { all: unset; cursor: pointer; padding: 8px 10px; font: 800 13px/1 var(--body); letter-spacing: .1em; text-transform: uppercase; color: var(--ink); white-space: nowrap; }
.tabs button.on { color: var(--gold-hi); }
.tabs button:focus-visible, .ev:focus-visible { outline: 1px solid var(--teal); }

/* social panel (right column, spans both rows) */
.social { grid-column: 2; grid-row: 1 / 3; border-left: 1px solid #463714; background: #010a13; display: flex; flex-direction: column; }
.me { display: flex; gap: 10px; align-items: center; padding: 12px 14px; border-bottom: 1px solid var(--line); }
.me .ic { width: 52px; height: 52px; border-radius: 50%; border: 2px solid var(--gold); padding: 2px; position: relative; flex: none; background: #000; }
.me .ic svg { width: 100%; height: 100%; display: block; }
.me .ic i { position: absolute; bottom: -7px; left: 50%; transform: translateX(-50%); font: 700 9px/1 var(--body); font-style: normal; color: var(--gold-hi); background: #010a13; border: 1px solid var(--gold-dim); border-radius: 8px; padding: 2px 5px; }
.me b { display: block; color: var(--gold-hi); font-size: 14px; }
.me small { color: var(--online); font-size: 12px; }
.me small::before { content: "● "; font-size: 9px; }
.soc-h { display: flex; justify-content: space-between; align-items: center; padding: 12px 14px 6px; font: 800 11px/1 var(--body); letter-spacing: .14em; color: var(--ink); }
.req { display: flex; justify-content: space-between; padding: 8px 14px; color: var(--gold); font-size: 14px; }
.req b { background: var(--gold-dim); color: var(--gold-hi); font-size: 11px; padding: 1px 6px; }
.grp { padding: 10px 14px 4px; font: 800 11px/1 var(--body); letter-spacing: .1em; color: var(--text); text-transform: uppercase; }
.grp::before { content: "▾ "; }
.fr { display: flex; gap: 10px; align-items: center; padding: 7px 14px; text-decoration: none; }
.fr:hover { background: rgba(200,170,110,.07); }
.fr .av { width: 34px; height: 34px; border-radius: 50%; border: 1px solid var(--gold-dim); display: grid; place-items: center; background: #0a1428; color: var(--gold-hi); flex: none; position: relative; }
.fr .av svg { width: 16px; height: 16px; }
.fr .av::after { content: ""; position: absolute; right: -2px; bottom: -2px; width: 9px; height: 9px; border-radius: 2px; background: var(--online); border: 2px solid #010a13; }
.fr.away .av::after { background: var(--away); }
.fr b { display: block; color: var(--gold-hi); font-size: 14px; font-weight: 600; line-height: 1.3; }
.fr small { color: var(--online); font-size: 12px; }
.fr.away small { color: var(--away); }
.soc-foot { margin-top: auto; display: flex; justify-content: space-between; align-items: center; padding: 8px 12px; border-top: 1px solid var(--line); font-size: 12px; color: var(--line-2); }

/* home body: left event list + hero */
.body { grid-column: 1; display: grid; grid-template-columns: 210px 1fr; min-height: 0; }
.body > * { min-width: 0; }
.events { border-right: 1px solid var(--line); padding: 14px 0; display: flex; flex-direction: column; background: rgba(1,10,19,.6); }
.ev { all: unset; cursor: pointer; display: flex; gap: 12px; align-items: center; padding: 12px 16px; font: 800 12px/1.3 var(--body); letter-spacing: .08em; text-transform: uppercase; color: var(--ink); position: relative; }
.ev::before { content: ""; position: absolute; left: 6px; top: 8px; width: 4px; height: 4px; border-radius: 50%; background: var(--gold); }
.ev .gl { width: 22px; height: 22px; flex: none; border: 1px solid var(--gold-dim); transform: rotate(45deg); display: grid; place-items: center; }
.ev .gl span { transform: rotate(-45deg); font-size: 9px; color: var(--gold); }
.ev.on { color: var(--gold-hi); background: linear-gradient(90deg, rgba(200,170,110,.18), transparent); }
.ev.on::after { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 2px; background: var(--gold); }
.events .sep { margin-top: auto; border-top: 1px solid var(--line); }

.hero { position: relative; overflow: hidden; padding: 30px 32px; display: grid; align-content: start; gap: 12px; min-height: 560px; }
.hero .bgimg { position: absolute; inset: 0; background-size: cover; background-position: center; opacity: .6; filter: saturate(.9); }
.hero .bgcurve { position: absolute; inset: 0; width: 100%; height: 100%; }
.hero .shade { position: absolute; inset: 0; background: linear-gradient(90deg, rgba(1,10,19,.96) 0%, rgba(1,10,19,.75) 45%, rgba(1,10,19,.25) 100%), linear-gradient(0deg, rgba(1,10,19,.9), transparent 40%); }
.hero > :not(.bgimg):not(.bgcurve):not(.shade):not(.panel):not(.actions) { position: relative; z-index: 1; }
.eyebrow { font: 800 13px/1 var(--body); letter-spacing: .1em; text-transform: uppercase; color: var(--gold); }
.hero h1 { font-size: clamp(28px, 4.4vw, 46px); line-height: 1.1; color: var(--gold-hi); letter-spacing: .03em; text-transform: uppercase; max-width: 16ch; }
.hero .desc { color: var(--gold-hi); max-width: 46ch; font-size: 15px; }
.hero .meta { display: flex; gap: 6px; flex-wrap: wrap; }
.hero .meta span { font: 700 11px/1 var(--body); padding: 6px 8px; border: 1px solid var(--line-2); background: rgba(1,10,19,.7); color: var(--ink); }
.hero .ranks { display: flex; gap: 22px; flex-wrap: wrap; margin-top: 6px; }
.rk { display: flex; gap: 12px; align-items: center; }
.rk .em { width: 58px; height: 58px; clip-path: polygon(50% 0, 95% 25%, 95% 70%, 50% 100%, 5% 70%, 5% 25%); display: grid; place-items: center; font: 800 15px/1 var(--display); color: #fff; }
.em.gm { background: radial-gradient(circle at 50% 35%, #ff9b8a, #c0392b 55%, #4a0f0a); }
.em.et { background: radial-gradient(circle at 50% 35%, #f0e2ff, #9b6bff 55%, #2c1560); }
.rk b { display: block; font: 700 15px/1.2 var(--display); color: var(--gold-hi); }
.rk small { font-size: 12px; color: var(--text); }
.chips { list-style: none; margin: 4px 0 0; padding: 0; display: flex; gap: 6px; flex-wrap: wrap; max-width: 520px; }
.chips li { font: 700 12px/1 var(--body); padding: 8px 10px; border: 1px solid var(--gold-dim); background: rgba(1,10,19,.75); color: var(--gold-hi); }
.hero .actions { position: absolute; right: 32px; bottom: 28px; z-index: 1; display: flex; gap: 8px; }
.gbtn { display: inline-block; padding: 9px 22px; font: 800 13px/1 var(--body); letter-spacing: .12em; text-transform: uppercase; color: var(--gold-hi); text-decoration: none; background: linear-gradient(180deg, #4a3a1c, #2a2010); border: 2px solid var(--gold); }
.gbtn.ghost { background: rgba(1,10,19,.8); border-color: var(--gold-dim); }
.gbtn:hover { border-color: var(--gold-hi); }
.panel { position: absolute; right: 32px; bottom: 84px; z-index: 1; width: min(280px, 60%); padding: 16px; background: rgba(4,20,35,.85); border: 1px solid #1e3a4a; text-align: center; font: 700 14px/1.4 var(--display); color: var(--gold-hi); letter-spacing: .06em; text-transform: uppercase; }
.panel small { display: block; font: 600 12px/1.4 var(--body); color: var(--text); text-transform: none; letter-spacing: 0; margin-top: 4px; }

@media (max-width: 960px) {
  .client { grid-template-columns: 1fr; }
  .social { grid-column: 1; grid-row: auto; border-left: 0; border-top: 1px solid #463714; }
  .body { grid-template-columns: 1fr; }
  .events { flex-direction: row; overflow-x: auto; padding: 0; border-right: 0; border-bottom: 1px solid var(--line); }
  .ev { padding: 12px 14px; white-space: nowrap; }
  .ev .gl { display: none; }
  .events .sep { margin: 0; border: 0; }
  .hero { min-height: 520px; padding: 24px 18px 120px; }
  .panel { left: 18px; right: 18px; width: auto; bottom: 74px; }
  .hero .actions { left: 18px; right: auto; bottom: 20px; }
}
@media (max-width: 520px) { .tabs { display: none; } .top { gap: 16px; } }
</style>

<script>
(function () {
  // Turnpoint-style gold win-chance curve, used as the personal home background.
  function curve() {
    var pts = [], y = 50, s = 7;
    for (var i = 0; i <= 40; i++) { s = (s * 9301 + 49297) % 233280; y += (s / 233280 - 0.42) * 9; y = Math.max(18, Math.min(82, y)); pts.push((i * 2.5).toFixed(1) + ',' + (100 - y).toFixed(1)); }
    return '<svg class="bgcurve" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true">' +
      '<g stroke="rgba(200,170,110,.12)" stroke-width=".15">' + [20,40,60,80].map(function (v) { return '<line x1="0" x2="100" y1="' + v + '" y2="' + v + '"/>'; }).join('') + '</g>' +
      '<line x1="0" x2="100" y1="50" y2="50" stroke="rgba(10,200,185,.35)" stroke-width=".2" stroke-dasharray="1 1"/>' +
      '<polyline points="' + pts.join(' ') + '" fill="none" stroke="#c8aa6e" stroke-width=".6" vector-effect="non-scaling-stroke" style="stroke-width:3px"/>' +
      </svg>';
  }
  var V = {
    home: { bg: 'curve', eyebrow: 'Player profile', title: 'Jasper Li', desc: 'Second-year CS at UofT. I build web apps, games and AI experiments.', meta: ['Class of 2029', 'Looking for a Summer 2027 SWE internship'], panel: ['Now playing', 'X Arena, a Roblox arena shooter'], actions: [['Play Turnpoint', 'https://league-web-app.vercel.app']] },
    turnpoint: { bg: 'img/turnpoint.webp', eyebrow: 'Featured project', title: 'Turnpoint', desc: 'A League match analyzer. It trains machine learning models on real match data to show why a game was won or lost.', meta: ['Next.js', 'TypeScript', 'Supabase'], actions: [['Code', 'https://github.com/Jaspyplayz/League-Web-App', 1], ['Play', 'https://league-web-app.vercel.app']] },
    petri: { bg: 'img/petri.webp', eyebrow: 'Project', title: 'Petri', desc: 'A self-evolving web app built by AI agents.', meta: ['Next.js', 'TypeScript'], actions: [['Code', 'https://github.com/Jaspyplayz/petri', 1], ['Play', 'https://petri-pi.vercel.app']] },
    xarena: { bg: 'curve', eyebrow: 'In development · Sep 2026 to now', title: 'X Arena', desc: 'A multiplayer arena shooter on Roblox, with FPS movement, server-validated hitboxes and lag compensation.', meta: ['Luau', 'Rojo', 'GitHub Actions'], panel: ['Coming soon', 'Playable build not public yet'] },
    ranks: { bg: 'curve', eyebrow: 'Ranked', title: 'Peak ranks', ranks: true },
    skills: { bg: 'curve', eyebrow: 'Mastery', title: 'Skills', skills: ['TypeScript', 'Python', 'Next.js', 'React', 'Tailwind CSS', 'Postgres', 'Supabase', 'Drizzle', 'Vitest', 'Playwright', 'GitHub Actions', 'Vercel', 'Luau', 'Rojo'] }
  };
  var hero = document.getElementById('hero');
  function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
  function render(k) {
    var v = V[k], h = '';
    h += v.bg === 'curve' ? curve() : '<div class="bgimg" style="background-image:url(' + v.bg + ')"></div>';
    h += '<div class="shade"></div>';
    h += '<div class="eyebrow">' + esc(v.eyebrow) + '</div><h1>' + esc(v.title) + '</h1>';
    if (v.desc) h += '<p class="desc">' + esc(v.desc) + '</p>';
    if (v.meta) h += '<div class="meta">' + v.meta.map(function (m) { return '<span>' + esc(m) + '</span>'; }).join('') + '</div>';
    if (v.ranks) h += '<div class="ranks"><div class="rk"><div class="em gm">GM</div><div><b>Peak Grandmaster</b><small>League of Legends · top 0.05% NA</small></div></div><div class="rk"><div class="em et">ET</div><div><b>Peak Eternity</b><small>Marvel Rivals · top 0.15%</small></div></div></div>';
    if (v.skills) h += '<ul class="chips">' + v.skills.map(function (s) { return '<li>' + esc(s) + '</li>'; }).join('') + '</ul>';
    if (v.panel) h += '<div class="panel">' + esc(v.panel[0]) + '<small>' + esc(v.panel[1]) + '</small></div>';
    if (v.actions) h += '<div class="actions">' + v.actions.map(function (a) { return '<a class="gbtn' + (a[2] ? ' ghost' : '') + '" href="' + a[1] + '" target="_blank" rel="noopener">' + esc(a[0]) + '</a>'; }).join('') + '</div>';
    hero.innerHTML = h;
    document.querySelectorAll('[data-ev]').forEach(function (b) { b.classList.toggle('on', b.dataset.ev === k || (b.closest('.tabs') && ((k === 'home' && b.dataset.ev === 'home') || (['turnpoint','petri','xarena'].indexOf(k) >= 0 && b.dataset.ev === 'turnpoint') || (k === 'ranks' && b.dataset.ev === 'ranks')))); });
  }
  document.querySelectorAll('[data-ev]').forEach(function (b) { b.addEventListener('click', function () { render(b.dataset.ev); }); });
  var h = (location.hash || '').slice(1);
  render(V[h] ? h : 'home');
})();
</script>
